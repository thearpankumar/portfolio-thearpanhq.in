name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly audit to catch newly published advisories

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build # tsc -b && vite build

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

  # Vercel's own Git integration is disabled (vercel.json), so these jobs are the
  # only path to a deployment, and they only run once `ci` and `audit` have passed.
  #
  # One-time setup (repo Settings -> Secrets and variables -> Actions):
  #   VERCEL_TOKEN       vercel.com/account/tokens
  #   VERCEL_ORG_ID      "orgId" in .vercel/project.json after `npx vercel link`
  #   VERCEL_PROJECT_ID  "projectId" in the same file
  # The Vercel CLI reads all three from the environment, so no --token flags.
  deploy-preview:
    name: Deploy Preview
    needs: [ci, audit]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Vercel credentials
        run: bash .github/scripts/check-vercel.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=preview --debug
      - run: vercel build
      - run: vercel deploy --prebuilt

  deploy-production:
    name: Deploy Production
    needs: [ci, audit]
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Check Vercel credentials
        run: bash .github/scripts/check-vercel.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --debug
      - run: vercel build --prod
      - run: vercel deploy --prebuilt --prod
