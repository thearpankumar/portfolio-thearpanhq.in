<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#292f61" />
      <stop offset="0.55" stop-color="#15162e" />
      <stop offset="1" stop-color="#050308" />
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bdc4ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#6c7bff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d9bff" />
      <stop offset="1" stop-color="#4a56d6" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)" />
  <circle cx="128" cy="128" r="104" fill="url(#glow)" />
  <!-- orbit rings -->
  <circle cx="128" cy="128" r="92" fill="none" stroke="#bdc4ff" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 7" />
  <circle cx="128" cy="128" r="62" fill="none" stroke="#bdc4ff" stroke-opacity="0.4" stroke-width="2" />
  <!-- links from core to cluster nodes and candidate dots -->
  <g stroke="#bdc4ff" stroke-linecap="round" stroke-opacity="0.55" stroke-width="2.5">
    <path d="M128 128 L128 66 M128 128 L74 160 M128 128 L182 160" />
  </g>
  <g stroke="#bdc4ff" stroke-linecap="round" stroke-opacity="0.22" stroke-width="1.5">
    <path d="M128 36 L128 66 M52 82 L74 160 M204 82 L182 160 M44 150 L74 160 M212 150 L182 160 M96 214 L74 160 M160 214 L182 160 M128 66 L52 82 M128 66 L204 82" />
  </g>
  <!-- candidate profile dots on the outer ring -->
  <g fill="#bdc4ff" fill-opacity="0.9">
    <circle cx="128" cy="36" r="4.5" />
    <circle cx="52" cy="82" r="4" />
    <circle cx="204" cy="82" r="4" />
    <circle cx="44" cy="150" r="3.5" />
    <circle cx="212" cy="150" r="3.5" />
    <circle cx="96" cy="214" r="3.5" />
    <circle cx="160" cy="214" r="3.5" />
  </g>
  <!-- cluster nodes: 1 writer + 2 readers -->
  <g stroke="#bdc4ff" stroke-width="3.5" stroke-linejoin="round">
    <circle cx="128" cy="66" r="13" fill="#6c7bff" fill-opacity="0.75" />
    <circle cx="74" cy="160" r="11" fill="#6c7bff" fill-opacity="0.4" />
    <circle cx="182" cy="160" r="11" fill="#6c7bff" fill-opacity="0.4" />
  </g>
  <!-- core hexagon with database stack -->
  <path d="M128 98 L154 113 V143 L128 158 L102 143 V113 Z" fill="url(#core)" stroke="#e6e9ff" stroke-width="4" stroke-linejoin="round" />
  <g fill="none" stroke="#e6e9ff" stroke-linecap="round" stroke-width="3.5">
    <ellipse cx="128" cy="119" rx="14" ry="5" fill="#ffffff" fill-opacity="0.2" />
    <path d="M114 119 V137 C114 145 142 145 142 137 V119" />
    <path d="M114 128 C114 136 142 136 142 128" stroke-opacity="0.8" />
  </g>
  <!-- stars -->
  <g fill="#ffffff" fill-opacity="0.75">
    <circle cx="24" cy="40" r="1.4" />
    <circle cx="232" cy="52" r="1.2" />
    <circle cx="30" cy="224" r="1.2" />
    <circle cx="226" cy="214" r="1.6" />
    <circle cx="236" cy="124" r="1" />
    <circle cx="18" cy="120" r="1.2" />
